<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 900' style='background: rgba(15,23,42,0.95); border-radius: 16px;'>
  <defs>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>
  
  <!-- Map Title Banner -->
  <text x='400' y='50' font-family='sans-serif' font-size='24' font-weight='900' fill='#ffffff' text-anchor='middle' letter-spacing='2'>MAP OF INDIA - REGIONAL SALES ZONES</text>
  <text x='400' y='78' font-family='sans-serif' font-size='13' font-weight='700' fill='#ffb84d' text-anchor='middle'>STATE-WISE &amp; TERRITORY PERFORMANCE BREAKDOWN</text>

  <!-- NORTH REGION (GREEN ZONE) -->
  <g id='region-north' fill='#16a34a' stroke='#ffffff' stroke-width='2' opacity='0.88'>
    <!-- J&K, Ladakh, HP, Punjab, Haryana, Rajasthan -->
    <path d='M280,100 L320,120 L360,110 L390,160 L360,210 L330,230 L270,260 L200,280 L160,340 L120,380 L180,450 L260,420 L300,340 L350,320 L350,250 L310,180 Z'/>
    <text x='230' y='290' font-family='sans-serif' font-size='18' font-weight='900' fill='#ffffff'>NORTH ZONE</text>
    <text x='230' y='312' font-family='sans-serif' font-size='13' font-weight='800' fill='#dcfce7'>₹12.45 Cr (17.6%)</text>
  </g>

  <!-- UP / NORTH-CENTRAL REGION (YELLOW ZONE) -->
  <g id='region-up' fill='#eab308' stroke='#ffffff' stroke-width='2' opacity='0.92'>
    <!-- Uttar Pradesh & Bihar -->
    <path d='M350,250 L480,240 L530,280 L520,340 L450,360 L380,360 L350,320 Z'/>
    <text x='430' y='295' font-family='sans-serif' font-size='16' font-weight='900' fill='#000000'>NORTH CENTRAL (UP/BIHAR)</text>
    <text x='430' y='318' font-family='sans-serif' font-size='13' font-weight='800' fill='#451a03'>₹8.92 Cr (12.6%)</text>
  </g>

  <!-- WEST / CENTRAL REGION (BLUE ZONE) -->
  <g id='region-west' fill='#0284c7' stroke='#ffffff' stroke-width='2' opacity='0.9'>
    <!-- Gujarat, Maharashtra, MP, Goa -->
    <path d='M180,450 L260,420 L380,360 L440,400 L440,510 L340,580 L280,590 L240,650 L200,600 L210,510 L140,490 Z'/>
    <text x='290' y='490' font-family='sans-serif' font-size='18' font-weight='900' fill='#ffffff'>WEST &amp; CENTRAL</text>
    <text x='290' y='512' font-family='sans-serif' font-size='13' font-weight='800' fill='#e0f2fe'>₹18.82 Cr (26.7%)</text>
  </g>

  <!-- EAST & NORTH-EAST REGION (CYAN ZONE) -->
  <g id='region-east' fill='#06b6d4' stroke='#ffffff' stroke-width='2' opacity='0.9'>
    <!-- West Bengal, Odisha, Jharkhand, Assam & NE -->
    <path d='M530,280 L580,270 L650,250 L730,270 L750,330 L690,380 L620,380 L550,420 L510,550 L440,510 L440,400 L450,360 L520,340 Z'/>
    <text x='570' y='430' font-family='sans-serif' font-size='18' font-weight='900' fill='#ffffff'>EAST &amp; N-EAST</text>
    <text x='570' y='452' font-family='sans-serif' font-size='13' font-weight='800' fill='#cffafe'>₹9.52 Cr (13.5%)</text>
  </g>

  <!-- SOUTH REGION (RED ZONE) -->
  <g id='region-south' fill='#dc2626' stroke='#ffffff' stroke-width='2' filter='url(#glow)' opacity='0.95'>
    <!-- AP, Telangana, Karnataka, TN, Kerala -->
    <path d='M240,650 L280,590 L340,580 L440,510 L510,550 L470,680 L420,780 L350,860 L320,830 L300,740 Z'/>
    <text x='370' y='680' font-family='sans-serif' font-size='22' font-weight='900' fill='#ffffff'>SOUTH INDIA (CORE)</text>
    <text x='370' y='705' font-family='sans-serif' font-size='15' font-weight='800' fill='#fee2e2'>₹20.90 Cr (29.6%)</text>
  </g>

  <!-- Legend Pin Overlays -->
  <circle cx='370' cy='740' r='10' fill='#ffffff' stroke='#dc2626' stroke-width='4'/>
  <text x='370' y='770' font-family='sans-serif' font-size='12' font-weight='900' fill='#ffffff' text-anchor='middle'>HQ / CHENNAI HUB</text>
</svg>