<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'>
  <rect width='320' height='200' rx='16' fill='#0f172a'/>
  <!-- Outer Gear -->
  <g transform='translate(220,100)' fill='none' stroke='#ffb84d' stroke-width='6'>
    <circle r='60' stroke-dasharray='15,8'/>
    <circle r='35' stroke-width='4'/>
    <circle r='12' fill='#ffb84d'/>
  </g>
  <!-- Small Gear -->
  <g transform='translate(130,140)' fill='none' stroke='#38bdf8' stroke-width='5'>
    <circle r='35' stroke-dasharray='12,6'/>
